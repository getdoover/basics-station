[project]
name = "basics-station"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.0.0a10",
    "aiohttp>=3.9",
]

[project.scripts]
export-config = "basics_station.app_config:export"
export-config-processor = "basics_station_processor.app_config:export"
export-ui-processor = "basics_station_processor.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basics_station", "src/basics_station_processor"]
